<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title} + ' — EcoFleet'">EcoFleet</title>
  <style>
    :root {
      --green:   #1e6b3f;
      --green2:  #2d9e5f;
      --green3:  #d4edda;
      --blue:    #1a5fa8;
      --accent:  #f0a500;
      --red:     #c0392b;
      --bg:      #f4f6f8;
      --surface: #ffffff;
      --border:  #e0e4e8;
      --text:    #1a1a1e;
      --muted:   #6b7280;
      --sidebar: #0f2d1f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: 230px; background: var(--sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .sidebar-logo .logo-name { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    .sidebar-logo .logo-tag  { font-size: 10px; color: #6dba8a; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
    .sidebar-logo .dot { width: 8px; height: 8px; background: #2d9e5f; border-radius: 50%; display: inline-block; margin-right: 6px; }

    .sidebar-nav { flex: 1; padding: 16px 0; }
    .nav-section { font-size: 10px; color: #4a7a5e; letter-spacing: .08em; text-transform: uppercase; padding: 10px 20px 4px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #a0c8b0; font-size: 13.5px; text-decoration: none; border-left: 3px solid transparent; transition: all .15s; }
    .nav-link:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-link.active { background: rgba(45,158,95,.15); color: #6dba8a; border-left-color: #2d9e5f; }
    .nav-icon { width: 18px; text-align: center; font-size: 15px; }

    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #4a7a5e; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 17px; font-weight: 600; color: var(--text); }
    .topbar-badge { background: var(--green3); color: var(--green); font-size: 11px; padding: 3px 10px; border-radius: 100px; font-weight: 500; }

    .content { flex: 1; padding: 28px; overflow-y: auto; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* STAT CARDS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
    .stat-icon { font-size: 22px; margin-bottom: 10px; }
    .stat-value { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: -.5px; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-card.green  { border-top: 3px solid var(--green2); }
    .stat-card.blue   { border-top: 3px solid var(--blue); }
    .stat-card.orange { border-top: 3px solid var(--accent); }
    .stat-card.red    { border-top: 3px solid var(--red); }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { background: var(--bg); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 500; }
    .badge-green  { background: #d4edda; color: #1e6b3f; }
    .badge-red    { background: #fde8e8; color: #c0392b; }
    .badge-orange { background: #fff3cd; color: #856404; }
    .badge-blue   { background: #dbeafe; color: #1a5fa8; }
    .badge::before { content: '●'; font-size: 7px; }

    /* FORMS */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13px; color: var(--text); width: 100%; transition: border .15s; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: var(--green2); box-shadow: 0 0 0 3px rgba(45,158,95,.1); }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; text-decoration: none; transition: all .15s; font-family: inherit; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: #165c34; }
    .btn-danger  { background: #fde8e8; color: var(--red); }
    .btn-danger:hover { background: #fbd5d5; }
    .btn-warning { background: #fff3cd; color: #856404; }
    .btn-warning:hover { background: #fce08a; }
    .btn-blue   { background: #dbeafe; color: var(--blue); }
    .btn-blue:hover { background: #bcd4f8; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* Comparativo */
    .compare-card { background: linear-gradient(135deg, #0f2d1f 0%, #1e6b3f 100%); color: #fff; border-radius: 12px; padding: 24px; }
    .compare-card h3 { font-size: 14px; font-weight: 600; opacity: .7; margin-bottom: 4px; }
    .compare-value { font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
    .compare-sub { font-size: 12px; opacity: .6; margin-top: 4px; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .compare-item { background: rgba(255,255,255,.1); border-radius: 8px; padding: 12px 14px; }
    .compare-item-val { font-size: 18px; font-weight: 600; }
    .compare-item-label { font-size: 11px; opacity: .6; margin-top: 2px; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-name"><span class="dot"></span>EcoFleet</div>
    <div class="logo-tag">Gestão de Frota</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <a href="/" class="nav-link" th:classappend="${title == 'Dashboard'} ? 'active'">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <div class="nav-section">Frota</div>
    <a href="/veiculos" class="nav-link" th:classappend="${title == 'Veículos'} ? 'active'">
      <span class="nav-icon">🚗</span> Veículos
    </a>
    <a href="/motoristas" class="nav-link" th:classappend="${title == 'Motoristas'} ? 'active'">
      <span class="nav-icon">👤</span> Motoristas
    </a>
    <a href="/registros" class="nav-link" th:classappend="${title == 'Registros'} ? 'active'">
      <span class="nav-icon">📋</span> Registros de Uso
    </a>
  </nav>
  <div class="sidebar-footer">EcoFleet · v1.0.0 · Facens 2026</div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" th:text="${title}">Página</div>
    <div class="topbar-badge">🌱 Sistema Ativo</div>
  </div>
  <div class="content">
    <div th:replace="${content}">conteúdo aqui</div>
  </div>
</div>

</body>
</html>
