<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Veículos', ~{::section})}">
<body><section>

  <div class="grid-2" style="align-items:start">

    <!-- FORMULÁRIO -->
    <div class="card">
      <div class="card-title">🚗 <span th:text="${veiculo.id != null} ? 'Editar Veículo' : 'Novo Veículo'">Novo Veículo</span></div>
      <form th:action="@{/veiculos/salvar}" method="post">
        <input type="hidden" th:field="*{veiculo.id}"/>
        <div class="form-grid">
          <div class="form-group">
            <label>Placa *</label>
            <input type="text" name="placa" th:value="${veiculo.placa}" placeholder="ABC-1234" required/>
          </div>
          <div class="form-group">
            <label>Modelo *</label>
            <input type="text" name="modelo" th:value="${veiculo.modelo}" placeholder="Ex: HB20 2022" required/>
          </div>
          <div class="form-group">
            <label>Tipo *</label>
            <select name="tipo" required>
              <option value="">Selecione...</option>
              <option value="carro" th:selected="${veiculo.tipo == 'carro'}">Carro</option>
              <option value="moto" th:selected="${veiculo.tipo == 'moto'}">Moto</option>
              <option value="van" th:selected="${veiculo.tipo == 'van'}">Van</option>
            </select>
          </div>
          <div class="form-group">
            <label>Combustível *</label>
            <select name="combustivel" required>
              <option value="">Selecione...</option>
              <option value="gasolina" th:selected="${veiculo.combustivel == 'gasolina'}">Gasolina</option>
              <option value="etanol" th:selected="${veiculo.combustivel == 'etanol'}">Etanol</option>
              <option value="diesel" th:selected="${veiculo.combustivel == 'diesel'}">Diesel</option>
              <option value="flex" th:selected="${veiculo.combustivel == 'flex'}">Flex</option>
            </select>
          </div>
          <div class="form-group">
            <label>Consumo médio (km/L) *</label>
            <input type="number" step="0.1" name="consumoMedioKmL" th:value="${veiculo.consumoMedioKmL}" placeholder="Ex: 12.5" required/>
          </div>
          <div class="form-group">
            <label>Ano de Fabricação</label>
            <input type="number" name="anoFabricacao" th:value="${veiculo.anoFabricacao}" placeholder="Ex: 2022"/>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select name="status">
              <option value="disponivel" th:selected="${veiculo.status == 'disponivel'}">Disponível</option>
              <option value="em_uso" th:selected="${veiculo.status == 'em_uso'}">Em uso</option>
              <option value="manutencao" th:selected="${veiculo.status == 'manutencao'}">Manutenção</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary">💾 Salvar</button>
          <a href="/veiculos" class="btn btn-warning">✕ Cancelar</a>
        </div>
      </form>
    </div>

    <!-- LISTA -->
    <div class="card">
      <div class="card-title">📋 Frota Cadastrada</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Placa</th>
              <th>Modelo</th>
              <th>Tipo</th>
              <th>Consumo</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="v : ${veiculos}">
              <td style="font-weight:500" th:text="${v.placa}">-</td>
              <td th:text="${v.modelo}">-</td>
              <td th:text="${v.tipo}">-</td>
              <td th:text="${v.consumoMedioKmL + ' km/L'}">-</td>
              <td>
                <span th:if="${v.status == 'disponivel'}" class="badge badge-green">Disponível</span>
                <span th:if="${v.status == 'em_uso'}" class="badge badge-orange">Em uso</span>
                <span th:if="${v.status == 'manutencao'}" class="badge badge-red">Manutenção</span>
              </td>
              <td>
                <div class="flex gap-2">
                  <a th:href="@{/veiculos/editar/{id}(id=${v.id})}" class="btn btn-blue btn-sm">✏️</a>
                  <a th:href="@{/veiculos/excluir/{id}(id=${v.id})}" class="btn btn-danger btn-sm"
                     onclick="return confirm('Excluir veículo?')">🗑️</a>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(veiculos)}">
              <td colspan="6" style="text-align:center;color:#6b7280;padding:24px">Nenhum veículo cadastrado</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</section></body>
</html>
