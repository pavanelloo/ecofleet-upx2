<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — EcoFleet</title>
  <style>
    :root {
      --green:   #1e6b3f;
      --green2:  #2d9e5f;
      --sidebar: #0f2d1f;
      --bg:      #f4f6f8;
      --surface: #ffffff;
      --border:  #e0e4e8;
      --text:    #1a1a1e;
      --muted:   #6b7280;
      --red:     #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      display: flex;
      width: 860px;
      min-height: 500px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.13);
    }
    /* Painel esquerdo verde */
    .login-brand {
      width: 340px;
      background: var(--sidebar);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 36px;
      gap: 20px;
    }
    .brand-icon {
      width: 72px; height: 72px;
      background: rgba(45,158,95,.18);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    .brand-name {
      font-size: 32px; font-weight: 800;
      color: #fff; letter-spacing: -.5px;
    }
    .brand-name span { color: #2d9e5f; }
    .brand-tagline {
      font-size: 13px; color: #6dba8a;
      text-align: center; line-height: 1.6;
    }
    .brand-badges {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center;
    }
    .badge {
      background: rgba(45,158,95,.18);
      color: #6dba8a;
      font-size: 10px; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      letter-spacing: .04em; text-transform: uppercase;
    }
    /* Painel direito branco */
    .login-form-wrap {
      flex: 1;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 52px 48px;
    }
    .form-title {
      font-size: 22px; font-weight: 700; color: var(--text);
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 13px; color: var(--muted); margin-bottom: 32px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: .05em; margin-bottom: 7px;
    }
    input[type=text], input[type=password] {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px;
      color: var(--text); background: var(--bg);
      outline: none; transition: border .15s;
    }
    input:focus { border-color: var(--green2); background: #fff; }
    .btn-login {
      width: 100%; padding: 12px;
      background: var(--green2); color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
      transition: background .15s;
    }
    .btn-login:hover { background: var(--green); }
    .error-msg {
      background: #fdecea; color: var(--red);
      border: 1px solid #f5c6c3;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .login-footer {
      margin-top: 32px; padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 11px; color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Painel esquerdo -->
    <div class="login-brand">
      <div class="brand-icon">🌿</div>
      <div class="brand-name">Eco<span>Fleet</span></div>
      <div class="brand-tagline">Sistema de Gestão de Frota<br>com Inteligência Ambiental</div>
      <div class="brand-badges">
        <span class="badge">ODS 12</span>
        <span class="badge">ODS 13</span>
        <span class="badge">Spring Boot</span>
      </div>
    </div>

    <!-- Formulário -->
    <div class="login-form-wrap">
      <div class="form-title">Bem-vindo de volta</div>
      <div class="form-subtitle">Acesse sua conta para gerenciar a frota</div>

      <div th:if="${param.error}" class="error-msg">
        ⚠️ Usuário ou senha incorretos. Tente novamente.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-login">Entrar →</button>
      </form>

      <div class="login-footer">
        EcoFleet · FACENS UPX2 2026 · Gestão de Frota Corporativa
      </div>
    </div>
  </div>
</body>
</html>
